# Full demo: `docker compose up`, then open http://localhost:3000.
# On first start the API generates the synthetic data, runs the pipeline and loads Postgres.
# Ports are published on 127.0.0.1 only: the API has no authentication. If 3000 or 8000
# are taken, choose others: WEB_PORT=3010 API_PORT=8010 docker compose up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bankrecon
      POSTGRES_PASSWORD: bankrecon
      POSTGRES_DB: bankrecon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h localhost goes through TCP, so the temporary init-only server (socket only)
      # is not mistaken for the real one.
      test: ["CMD-SHELL", "pg_isready -h localhost -U bankrecon -d bankrecon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    image: bankrecon-api
    environment:
      DATABASE_URL: postgresql+psycopg://bankrecon:bankrecon@db:5432/bankrecon
    volumes:
      - apidata:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    image: bankrecon-web
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  apidata:
